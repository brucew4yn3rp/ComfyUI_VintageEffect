[project]
name = "vintageeffect"
description = "ComfyUI node that applies vintage/retro effects through JPG compression, color grading, film grain, vignette, and more to emulate more realistic photo aesthetics."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
